<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo con Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles/catalogo.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="scripts/clima.js" defer></script>
    <script src="scripts/datos.js" defer></script>
    <script src="scripts/carrito.js" defer></script>
    <script src="scripts/catalogo.js" defer></script>
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-success sticky-top">
        <div class="container">
            <span class="navbar-brand marca">Vivero Raíz</span>
            <span id="clima" class="badge text-bg-light d-none d-sm-inline">Cargando clima...</span>
            <button class="btn btn-outline-light" data-bs-toggle="offcanvas" data-bs-target="#carrito">
                Carrito <span id="contador" class="badge text-bg-warning">0</span>
            </button>
        </div>
    </nav>

    <main class="container py-4">
        <h2 class="text-success border-bottom pb-2 mb-4">Catálogo</h2>
        <div id="catalogo" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4"></div>
    </main>

    <div id="carrito" class="offcanvas offcanvas-end" tabindex="-1">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Tu carrito</h5>
            <button class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <ul id="items-carrito" class="list-group mb-3"></ul>
            <p class="fs-5 mt-auto">Total: <strong id="total">$ 0</strong></p>
            <button id="vaciar" class="btn btn-outline-danger">Vaciar carrito</button>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="aviso" class="toast text-bg-success">
            <div class="toast-body"></div>
        </div>
    </div>
</body>

</html>
