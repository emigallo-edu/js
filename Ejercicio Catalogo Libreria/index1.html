<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de clicks</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="scripts/contador.js" defer></script>
</head>

<body class="bg-light">
    <main class="container py-4">
        <h2 class="text-success border-bottom pb-2 mb-4">Contador de clicks</h2>
        <div class="row g-4">
            <div class="col-sm-6">
                <div class="card text-center p-3">
                    <h3 class="h5">En memoria</h3>
                    <p class="display-4" id="valor-memoria">0</p>
                    <button id="sumar-memoria" class="btn btn-success">Sumar</button>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="card text-center p-3">
                    <h3 class="h5">Con localStorage</h3>
                    <p class="display-4" id="valor-storage">0</p>
                    <button id="sumar-storage" class="btn btn-success">Sumar</button>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
